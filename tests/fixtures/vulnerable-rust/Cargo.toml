[package]
name = "vulnerable-rust-fixture"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
# RUSTSEC-2020-0071 — time before 0.2.23 has a soundness issue
# in localtime_r on unix. Intentionally pinned here for fixture purposes.
time = "0.1.43"

# No git-URL dependency here on purpose. cargo-audit, cargo-deny and
# cargo-geiger all resolve the dependency graph before analysing it, and an
# unresolvable git source made every one of them fail before scanning
# anything (2026-08-27 recording audit, BL-00A). The graph must resolve
# from crates.io alone; Cargo.lock is committed so the audit is reproducible.

[profile.release]
overflow-checks = false
lto = false
